# On-demand / marker-triggered: rebuild Ubuntu 24.04 AppImage, move v1.3.6
# tag to this commit, recreate the release, and replace the AppImage asset.
name: Refresh AppImage (v1.3.6)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/trigger-appimage-refresh"

permissions:
  contents: write

concurrency:
  group: refresh-appimage-v136
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build AppImage (Ubuntu 24.04)
        run: bash packaging/build-appimage-ubuntu2404.sh

      - name: Verify artifact
        run: |
          test -f dist/Meridian-x86_64.AppImage
          sha256sum dist/Meridian-x86_64.AppImage | tee dist/Meridian-x86_64.AppImage.sha256
          python3 packaging/audit-appimage-glibc.py dist/Meridian-x86_64.AppImage

      - name: Retag, recreate release, upload AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 dist/Meridian-x86_64.AppImage.sha256)
          COMMIT=${GITHUB_SHA}
          NOTES="Meridian 1.3.6 — source archives + AppImage refreshed 2026-10-01. Version stays **1.3.6**.

          ## This refresh (high-severity / score 7–10)
          - Close ffmpeg decode pipes on abort/timeout/error (FD / subprocess leak)
          - Scan-worker generation guards so stale completions cannot replace a newer scan
          - Analyze-worker capture/reap per generation; ignore stale completion restarts
          - Loved tracks that fit the lens stay in NOW/DEEP instead of FILL under band bias
          - ffmpeg wall timeout scales with decode duration (\`max(dur + 10, 30)\`)

          Source tag \`v1.3.6\` points at master \`${COMMIT}\` (GitHub Source code zip/tar.gz match this commit).
          AppImage SHA256: \`${SHA}\`

          See [CHANGELOG.md](https://github.com/dark1ltg/Meridian/blob/master/CHANGELOG.md) for full notes.

          ## Still in 1.3.6
          Mood-map import UX (2026-09-25), Renew Queue, mid-fade credit, VA album anti-repeat, BPM 0 scan confidence, Renew first-run tip, pin lock rings."

          # Drop existing release + tag so source archives and published_at refresh.
          gh release delete v1.3.6 --yes || true
          git push origin :refs/tags/v1.3.6 || true
          git tag -f v1.3.6 "$COMMIT"
          git push origin "refs/tags/v1.3.6"

          gh release create v1.3.6 \
            --title "Meridian 1.3.6" \
            --notes "$NOTES" \
            --target "$COMMIT" \
            dist/Meridian-x86_64.AppImage

          echo "Published https://github.com/dark1ltg/Meridian/releases/tag/v1.3.6"
          echo "AppImage https://github.com/dark1ltg/Meridian/releases/download/v1.3.6/Meridian-x86_64.AppImage"
          echo "SHA256 ${SHA}"
