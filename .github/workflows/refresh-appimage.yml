# On-demand: rebuild Ubuntu 24.04 AppImage and replace the v1.3.6 release asset.
name: Refresh AppImage (v1.3.6)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-appimage-v136
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage (Ubuntu 24.04)
        run: bash packaging/build-appimage-ubuntu2404.sh

      - name: Verify artifact
        run: |
          test -f dist/Meridian-x86_64.AppImage
          sha256sum dist/Meridian-x86_64.AppImage | tee dist/Meridian-x86_64.AppImage.sha256
          python3 packaging/audit-appimage-glibc.py dist/Meridian-x86_64.AppImage

      - name: Upload to GitHub Release v1.3.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 dist/Meridian-x86_64.AppImage.sha256)
          COMMIT=${GITHUB_SHA}
          NOTES="Meridian 1.3.6 — AppImage refreshed $(date -u +%Y-%m-%d). Version stays **1.3.6**.

          Built from \`master\` \`${COMMIT}\`.
          AppImage SHA256: \`${SHA}\`

          See [CHANGELOG.md](https://github.com/dark1ltg/Meridian/blob/master/CHANGELOG.md) for release notes."
          gh release upload v1.3.6 dist/Meridian-x86_64.AppImage --clobber
          gh release edit v1.3.6 --title "Meridian 1.3.6" --notes "$NOTES"
          echo "Uploaded https://github.com/dark1ltg/Meridian/releases/download/v1.3.6/Meridian-x86_64.AppImage"
